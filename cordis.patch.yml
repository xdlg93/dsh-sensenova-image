# SenseNova U1.5 image tool + settings page.
# The models are image-generation models, not chat models: they are exposed to
# every agent (including subagents) through the sensenova_generate_image tool.
# The settings page writes the volatile fields below; tool calls may override
# them explicitly.
- insert:
    - id: sensenova-image
      name: dsh-sensenova-image
      config:
        apiKeyEnv: SENSENOVA_API_KEY
        baseURL: https://token.sensenova.cn/v1
        model: sensenova-u1.5-lite
        size: 2048x2048
        n: 1
        watermark: false
        prompt_extend: true
        output_format: png
        outputDir: generated-images
        requestTimeoutMs: 180000
